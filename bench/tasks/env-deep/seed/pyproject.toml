[project]
name = "reports"
version = "0.3.0"
description = "Command line client of the reports service."
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "BLE", "S", "DTZ", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
